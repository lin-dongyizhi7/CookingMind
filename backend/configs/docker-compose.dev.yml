version: '3.8'

services:
  # MongoDB 开发数据库
  mongodb-dev:
    image: mongo:7.0
    container_name: cooking-mind-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: cooking_mind_dev
    volumes:
      - mongodb_dev_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - cooking-mind-dev

  # Redis 开发缓存
  redis-dev:
    image: redis:7.2-alpine
    container_name: cooking-mind-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    networks:
      - cooking-mind-dev

  # MongoDB Express (可选，用于数据库管理)
  mongo-express-dev:
    image: mongo-express:1.0.0
    container_name: cooking-mind-mongo-express-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb-dev:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password123
    depends_on:
      - mongodb-dev
    networks:
      - cooking-mind-dev

volumes:
  mongodb_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  cooking-mind-dev:
    driver: bridge
